name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Flip7ScoreTracker-debug
        path: app/build/outputs/apk/debug/Flip7ScoreTracker-debug-v*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Flip7ScoreTracker-release
        path: app/build/outputs/apk/release/Flip7ScoreTracker-release-v*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK with full version
      run: |
        mv app/build/outputs/apk/debug/Flip7ScoreTracker-debug-v*.apk \
           app/build/outputs/apk/debug/Flip7ScoreTracker-v1.0.${{ github.run_number }}.apk

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/Flip7ScoreTracker-v1.0.${{ github.run_number }}.apk
        token: ${{ secrets.GITHUB_TOKEN }}
